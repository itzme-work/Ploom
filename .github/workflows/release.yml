name: Publish Ploom
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (X.Y.Z or X.Y.Z-beta.N)'
        required: true
        type: string
      mode:
        description: Release action
        type: choice
        required: true
        default: Build only
        options:
          - Build only
          - Publish
      confirm:
        description: 'Publish these signed packages to official GitHub Releases'
        required: true
        default: false
        type: boolean
concurrency:
  group: official-ploom-release
  cancel-in-progress: false
permissions:
  contents: read
defaults:
  run:
    working-directory: apps/client
jobs:
  build:
    if: (inputs.mode == 'Build only' || (inputs.mode == 'Publish' && inputs.confirm)) && github.ref_type == 'branch' && github.repository == 'itzme-work/Ploom' && github.ref_name == github.event.repository.default_branch && github.actor == github.repository_owner
    environment: ploom-release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: 22}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: runner.os == 'Linux'
        with: {distribution: temurin, java-version: 17}
      - name: Configure official version
        env:
          PLOOM_UPDATER_PUBLIC_KEY: ${{ vars.UPDATER_PUBLIC_KEY }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: python ../../scripts/configure-release.py "$VERSION"
      - run: npm ci
      - if: runner.os == 'Windows'
        env:
          PLOOM_UPDATER_PUBLIC_KEY: ${{ vars.UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_TAURI_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.RELEASE_TAURI_PASSWORD }}
        shell: bash
        run: |
          test -n "$PLOOM_UPDATER_PUBLIC_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          npm run tauri -- build --bundles nsis
          mkdir deliver
          cp src-tauri/target/release/bundle/nsis/*.exe deliver/Ploom.exe
          cp src-tauri/target/release/bundle/nsis/*.exe.sig deliver/Ploom.exe.sig
      - if: runner.os == 'Linux'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          export NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          rustup target add aarch64-linux-android
          npm run tauri -- android init --ci
          python3 android/prepare.py
          npm run tauri -- android build --apk --target aarch64
      - if: runner.os == 'Linux'
        env:
          STORE: ${{ secrets.RELEASE_ANDROID_P12_BASE64 }}
          PASS: ${{ secrets.RELEASE_ANDROID_PASSWORD }}
        run: |
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf %s "$STORE" | base64 -d > "$key"
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*unsigned.apk' -print -quit)
          test -s "$apk"
          mkdir deliver
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -P 16 -f 4 "$apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$key" --ks-pass env:PASS --out deliver/Ploom-arm64.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose deliver/Ploom-arm64.apk
          "$tools/zipalign" -c -P 16 4 deliver/Ploom-arm64.apk
          python3 ../../scripts/check-arm64.py deliver/Ploom-arm64.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: official-${{ runner.os }}
          retention-days: 3
          path: |
            apps/client/deliver/*.apk
            apps/client/deliver/*.exe
            apps/client/deliver/*.sig
          if-no-files-found: error
  verify:
    needs: build
    environment: ploom-release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: official-*
          path: deliver
          merge-multiple: true
      - name: Verify signed installer and APK
        env:
          PUBLIC_KEY: ${{ vars.UPDATER_PUBLIC_KEY }}
          VERSION: ${{ inputs.version }}
          CERT_DIGEST: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y minisign
          printf %s "$PUBLIC_KEY" | base64 -d > "$RUNNER_TEMP/pub"
          base64 -d deliver/Ploom.exe.sig > "$RUNNER_TEMP/signature"
          minisign -Vm deliver/Ploom.exe -p "$RUNNER_TEMP/pub" -x "$RUNNER_TEMP/signature"
          sed -n '3p' "$RUNNER_TEMP/signature" | tr '\t' '\n' | grep -Fx "version:$VERSION"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify --print-certs deliver/Ploom-arm64.apk > "$RUNNER_TEMP/cert"
          grep -Fxi "Signer #1 certificate SHA-256 digest: $CERT_DIGEST" "$RUNNER_TEMP/cert"
          "$tools/aapt" dump badging deliver/Ploom-arm64.apk > "$RUNNER_TEMP/badging"
          grep "^package: name='work.itzme.ploom' " "$RUNNER_TEMP/badging" | grep -F "versionName='$VERSION'"
          for f in deliver/Ploom.exe deliver/Ploom-arm64.apk; do test "$(stat -c %s "$f")" -le 268435456; done
          jq -n --arg v "$VERSION" --arg sig "$(cat deliver/Ploom.exe.sig)" \
            '{version:$v,platforms:{"windows-x86_64":{signature:$sig,url:("https://github.com/itzme-work/Ploom/releases/download/v"+$v+"/Ploom.exe")}}}' > deliver/latest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-release
          path: deliver
          retention-days: 3
          if-no-files-found: error
  publish:
    if: inputs.mode == 'Publish' && inputs.confirm && github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    environment: ploom-release
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-release
          path: deliver
      - name: Publish only after all assets are uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          refs=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag")
          if jq -e --arg ref "refs/tags/$tag" 'any(.[]; .ref == $ref)' <<< "$refs" >/dev/null; then
            echo "Tag already exists; choose a new version." >&2
            exit 1
          fi
          flags=()
          if [[ "$VERSION" == *-beta.* ]]; then flags+=(--prerelease); fi
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Ploom $VERSION" --generate-notes "${flags[@]}" deliver/Ploom.exe deliver/Ploom.exe.sig deliver/Ploom-arm64.apk deliver/latest.json
          gh release edit "$tag" --draft=false
