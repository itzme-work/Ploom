name: Publish Ploom
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (X.Y.Z or X.Y.Z-beta.N)'
        required: true
        type: string
      mode:
        description: Release action
        type: choice
        required: true
        default: Build only
        options:
          - Build only
          - Publish
      confirm:
        description: 'Publish these signed packages to official GitHub Releases'
        required: true
        default: false
        type: boolean
concurrency:
  group: official-ploom-publication
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    if: (inputs.mode == 'Build only' || (inputs.mode == 'Publish' && inputs.confirm)) && github.ref_type == 'branch' && github.repository == 'itzme-work/Ploom' && github.ref_name == github.event.repository.default_branch && github.actor == github.repository_owner
    uses: ./.github/workflows/signed-packages.yml
    with:
      version: ${{ inputs.version }}
      mode: Build only
  publish:
    if: inputs.mode == 'Publish' && inputs.confirm && github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    environment: ploom-release
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-release
          path: deliver
      - name: Publish only after all assets are uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          refs=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag")
          if jq -e --arg ref "refs/tags/$tag" 'any(.[]; .ref == $ref)' <<< "$refs" >/dev/null; then
            echo "Tag already exists; choose a new version." >&2
            exit 1
          fi
          flags=()
          if [[ "$VERSION" == *-beta.* ]]; then flags+=(--prerelease); fi
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Ploom $VERSION" --generate-notes "${flags[@]}" deliver/Ploom.exe deliver/Ploom.exe.sig deliver/Ploom-arm64.apk deliver/latest.json
          gh release edit "$tag" --draft=false
