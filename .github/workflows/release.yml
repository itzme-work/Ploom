name: Publish Ploom
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (X.Y.Z or X.Y.Z-beta.N)'
        required: true
        type: string
      mode:
        description: Release action
        type: choice
        required: true
        default: Build only
        options:
          - Build only
          - Repair Android 0.3.0
          - Build hotfix pair
          - Publish
      confirm:
        description: 'Publish these signed packages to official GitHub Releases'
        required: true
        default: false
        type: boolean
concurrency:
  group: official-ploom-publication
  cancel-in-progress: false
permissions:
  contents: read
defaults:
  run:
    working-directory: apps/client
jobs:
  build:
    if: (inputs.mode == 'Build only' || (inputs.mode == 'Repair Android 0.3.0' && inputs.version == '0.3.0') || inputs.mode == 'Build hotfix pair' || (inputs.mode == 'Publish' && inputs.confirm)) && github.ref_type == 'branch' && github.repository == 'itzme-work/Ploom' && github.ref_name == github.event.repository.default_branch && github.actor == github.repository_owner
    environment: ploom-release
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.mode == 'Repair Android 0.3.0' && '["ubuntu-latest"]' || '["windows-2022","ubuntu-latest"]') }}
        version: ${{ fromJSON(inputs.mode == 'Build hotfix pair' && '["0.1.2","0.1.3"]' || format('[{0}]', toJSON(inputs.version))) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: 22}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: runner.os == 'Linux'
        with: {distribution: temurin, java-version: 17}
      - name: Configure official version
        env:
          PLOOM_UPDATER_PUBLIC_KEY: ${{ vars.UPDATER_PUBLIC_KEY }}
          VERSION: ${{ matrix.version }}
        shell: bash
        run: python ../../scripts/configure-release.py "$VERSION"
      - run: npm ci
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        if: startsWith(matrix.version, '0.3.')
        with: {go-version: 1.26.10, cache: false}
      - name: Prepare reviewed Windows engine
        if: runner.os == 'Windows' && startsWith(matrix.version, '0.3.')
        working-directory: .
        shell: pwsh
        run: |
          ./scripts/windows-core/build.ps1
          "PLOOM_CORE_SHA256=$env:PLOOM_CORE_SHA256" >> $env:GITHUB_ENV
          '{"bundle":{"resources":["engine/*"]}}' | Set-Content apps/client/src-tauri/engine-config.json -Encoding utf8NoBOM
      - if: runner.os == 'Windows'
        env:
          PLOOM_UPDATER_PUBLIC_KEY: ${{ vars.UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_TAURI_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.RELEASE_TAURI_PASSWORD }}
        shell: bash
        run: |
          test -n "$PLOOM_UPDATER_PUBLIC_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          args=()
          if [[ -f src-tauri/engine-config.json ]]; then args+=(--config src-tauri/engine-config.json); fi
          npm run tauri -- build --bundles nsis "${args[@]}"
          mkdir deliver
          cp src-tauri/target/release/bundle/nsis/*.exe deliver/Ploom.exe
          cp src-tauri/target/release/bundle/nsis/*.exe.sig deliver/Ploom.exe.sig
          if [[ -f src-tauri/engine-config.json ]]; then cp "$RUNNER_TEMP/windows-core-buildinfo.txt" deliver/; fi
      - if: runner.os == 'Linux'
        env:
          RELEASE_VERSION: ${{ matrix.version }}
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          export NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export ANDROID_NDK_HOME="$NDK_HOME"
          if [[ "$RELEASE_VERSION" == 0.3.* ]]; then
            src="$RUNNER_TEMP/corresponding"
            bash ../../scripts/libbox/build.sh "$src" release
            export PLOOM_LIBBOX_AAR="$src/libbox.aar"
            python ../../scripts/libbox/sbom.py "$src"
            python ../../scripts/libbox/notices.py "$src"
            cp -r ../../LICENSES ../../LICENSE ../../NOTICE "$src/"
            git -C ../.. archive --format=tar.gz -o "$src/ploom-source.tar.gz" HEAD
            npm sbom --package-lock-only --omit=dev --sbom-format=cyclonedx > "$src/frontend.cdx.json"
            cargo vendor --locked --manifest-path src-tauri/Cargo.toml "$src/rust-vendor" > "$src/cargo-vendor-config.toml"
            mkdir -p "$src/frontend-packages"
            python ../../scripts/release-npm-sources.py "$src/frontend-packages"
            tar -czf "$RUNNER_TEMP/Ploom-source.tar.gz" -C "$src" --exclude=libbox.aar --exclude=SHA256SUMS .
          fi
          rustup target add aarch64-linux-android
          npm run tauri -- android init --ci
          python3 android/prepare.py
          if [[ "$RELEASE_VERSION" == 0.3.* ]]; then
            cp -R "$src/third-party" src-tauri/gen/android/app/src/main/assets/licenses/
          fi
          npm run tauri -- android build --apk --target aarch64
      - if: runner.os == 'Linux'
        env:
          STORE: ${{ secrets.RELEASE_ANDROID_P12_BASE64 }}
          PASS: ${{ secrets.RELEASE_ANDROID_PASSWORD }}
        run: |
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf %s "$STORE" | base64 -d > "$key"
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*unsigned.apk' -print -quit)
          test -s "$apk"
          mkdir deliver
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -P 16 -f 4 "$apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$key" --ks-pass env:PASS --out deliver/Ploom-arm64.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose deliver/Ploom-arm64.apk
          "$tools/zipalign" -c -P 16 4 deliver/Ploom-arm64.apk
          python3 ../../scripts/check-arm64.py deliver/Ploom-arm64.apk
      - if: runner.os == 'Linux' && startsWith(matrix.version, '0.3.')
        run: |
          python3 ../../scripts/check-release-dex.py deliver/Ploom-arm64.apk
          unzip -t deliver/Ploom-arm64.apk lib/arm64-v8a/libbox.so
          cp "$RUNNER_TEMP/Ploom-source.tar.gz" deliver/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.mode == 'Build hotfix pair' && format('{0}-', matrix.version) || '' }}official-${{ runner.os }}
          retention-days: 3
          path: |
            apps/client/deliver/*.apk
            apps/client/deliver/*.exe
            apps/client/deliver/*.sig
            apps/client/deliver/*.tar.gz
            apps/client/deliver/*buildinfo.txt
          if-no-files-found: error
  verify:
    needs: build
    strategy:
      matrix:
        version: ${{ fromJSON(inputs.mode == 'Build hotfix pair' && '["0.1.2","0.1.3"]' || format('[{0}]', toJSON(inputs.version))) }}
    environment: ploom-release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ${{ inputs.mode == 'Build hotfix pair' && format('{0}-official-*', matrix.version) || 'official-*' }}
          path: deliver
          merge-multiple: true
      - name: Reuse previously verified Windows installer and signature
        if: inputs.mode == 'Repair Android 0.3.0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45825342178 -R itzme-work/Ploom -n official-Windows -D previous
          cd previous
          sha256sum -c <<'SUMS'
          d6962bddd327567da1fc6b4d5a110fe5bb055525c92332ce1539435d1855355e  Ploom.exe
          70ed949dbb3cc3eaa1eb480075998bdc72834884aed77f9e7dc8738062ec16fa  Ploom.exe.sig
          3f37caada33ecb533e782fb557b19dd7aa35398c7779b49402cee2edffdb0414  windows-core-buildinfo.txt
          SUMS
          cp Ploom.exe Ploom.exe.sig windows-core-buildinfo.txt ../deliver/
      - name: Verify signed installer and APK
        env:
          PUBLIC_KEY: ${{ vars.UPDATER_PUBLIC_KEY }}
          VERSION: ${{ matrix.version }}
          CERT_DIGEST: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y minisign
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"
          bash scripts/verify-release-assets.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ inputs.mode == 'Build hotfix pair' && format('verified-{0}', matrix.version) || 'verified-release' }}
          path: deliver
          retention-days: 3
          if-no-files-found: error
  windows:
    if: inputs.mode == 'Build hotfix pair'
    needs: verify
    defaults:
      run:
        working-directory: .
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: 'verified-*', path: packages}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22}
      - run: npm ci
        working-directory: apps/client
      - shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'installed-ploom'
          foreach ($version in '0.1.2','0.1.3') {
            $installer = (Resolve-Path "packages/verified-$version/Ploom.exe").Path
            $proc = Start-Process $installer -ArgumentList "/S /D=$dir" -Wait -PassThru
            if ($proc.ExitCode -ne 0) { throw "NSIS exit $($proc.ExitCode)" }
            node apps/client/e2e/windows-update-pair.mjs "$dir/ploom.exe" $version 0.1.2
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            ./scripts/windows/Test-CloudIcon.ps1 $installer "$dir/ploom.exe"
          }
  signed-connection:
    if: startsWith(inputs.version, '0.3.') && inputs.mode != 'Build hotfix pair'
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.mode == 'Repair Android 0.3.0' && '["ubuntu-latest"]' || '["windows-2022","ubuntu-latest"]') }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: verified-release, path: candidate}
      - name: Retrieve and authenticate the original 0.2.0 baseline
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN: ${{ vars.PLOOM_020_BASELINE_RUN || '45560158367' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASELINE_RUN" =~ ^[0-9]+$ ]]
          gh run download "$BASELINE_RUN" -R itzme-work/Ploom -n verified-release -D baseline
          cd baseline
          echo '5e799611a2ca59a2f87b6edc8afc464496de5b705d19aea80a94485345c339ce  Ploom-arm64.apk' | sha256sum -c -
          echo '91fbe9a8b922080c243c5f4bc69660a3cecd3cb86a81ddc45069e0be8ad534ef  Ploom.exe' | sha256sum -c -
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: runner.os == 'Windows'
        with: {node-version: 22}
      - if: runner.os == 'Windows'
        working-directory: apps/client
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          npm ci
          if ($LASTEXITCODE) { throw 'npm ci failed' }
          $dir = Join-Path $env:RUNNER_TEMP 'installed-official'
          $env:WEBVIEW2_USER_DATA_FOLDER = Join-Path $env:RUNNER_TEMP 'migration-profile'
          $env:PLOOM_MIGRATE_LIBRARY = '1'
          foreach ($stage in @(@('0.2.0','baseline'),@($env:VERSION,'candidate'))) {
            $exe = Resolve-Path "../../$($stage[1])/Ploom.exe"
            $proc = Start-Process $exe -ArgumentList "/S /D=$dir" -Wait -PassThru
            if ($proc.ExitCode) { throw 'Installer failed' }
            node e2e/windows-update-pair.mjs "$dir/ploom.exe" $stage[0] '0.2.0'
            if ($LASTEXITCODE) { throw 'Migration failed' }
          }
          if (Get-ChildItem $dir -File -Filter wintun.dll -Recurse) { throw 'Unexpected Wintun' }
          foreach ($mode in 'local','system') {
            $env:WEBVIEW2_USER_DATA_FOLDER = Join-Path $env:RUNNER_TEMP "connection-$mode"
            node e2e/windows-local.mjs "$dir/ploom.exe" $mode
            if ($LASTEXITCODE) { throw 'Installed proxy challenge failed' }
          }
      - if: runner.os == 'Linux'
        run: sudo chmod a+rw /dev/kvm
      - if: runner.os == 'Linux'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disk-size: 6G
          script: python3 scripts/test-signed-connection.py
  publish:
    if: always() && needs.verify.result == 'success' && (needs.signed-connection.result == 'success' || !startsWith(inputs.version, '0.3.')) && inputs.mode == 'Publish' && inputs.confirm && github.event_name == 'workflow_dispatch'
    needs: [verify, signed-connection]
    runs-on: ubuntu-latest
    environment: ploom-release
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-release
          path: deliver
      - name: Publish only after all assets are uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          refs=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag")
          if jq -e --arg ref "refs/tags/$tag" 'any(.[]; .ref == $ref)' <<< "$refs" >/dev/null; then
            echo "Tag already exists; choose a new version." >&2
            exit 1
          fi
          flags=()
          if [[ "$VERSION" == *-beta.* ]]; then flags+=(--prerelease); fi
          if [[ "$VERSION" == 0.3.* ]]; then test -s deliver/Ploom-source.tar.gz; flags+=(deliver/Ploom-source.tar.gz deliver/windows-core-buildinfo.txt); fi
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Ploom $VERSION" --generate-notes "${flags[@]}" deliver/Ploom.exe deliver/Ploom.exe.sig deliver/Ploom-arm64.apk deliver/latest.json
          gh release edit "$tag" --draft=false
