name: Build and verify signed packages
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      mode:
        type: string
        default: Build only
      pair:
        type: boolean
        default: false
concurrency:
  group: official-ploom-release
  cancel-in-progress: false
permissions:
  contents: read
defaults:
  run:
    working-directory: apps/client
jobs:
  build:
    if: inputs.mode == 'Build only' && github.ref_type == 'branch' && github.repository == 'itzme-work/Ploom' && github.ref_name == github.event.repository.default_branch && github.actor == github.repository_owner
    environment: ploom-release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: 22}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: runner.os == 'Linux'
        with: {distribution: temurin, java-version: 17}
      - name: Configure official version
        env:
          PLOOM_UPDATER_PUBLIC_KEY: ${{ vars.UPDATER_PUBLIC_KEY }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: python ../../scripts/configure-release.py "$VERSION"
      - run: npm ci
      - if: runner.os == 'Windows'
        env:
          PLOOM_UPDATER_PUBLIC_KEY: ${{ vars.UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_TAURI_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.RELEASE_TAURI_PASSWORD }}
        shell: bash
        run: |
          test -n "$PLOOM_UPDATER_PUBLIC_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          npm run tauri -- build --bundles nsis
          mkdir deliver
          cp src-tauri/target/release/bundle/nsis/*.exe deliver/Ploom.exe
          cp src-tauri/target/release/bundle/nsis/*.exe.sig deliver/Ploom.exe.sig
      - if: runner.os == 'Linux'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          export NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          rustup target add aarch64-linux-android
          npm run tauri -- android init --ci
          python3 android/prepare.py
          npm run tauri -- android build --apk --target aarch64
      - if: runner.os == 'Linux'
        env:
          STORE: ${{ secrets.RELEASE_ANDROID_P12_BASE64 }}
          PASS: ${{ secrets.RELEASE_ANDROID_PASSWORD }}
        run: |
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf %s "$STORE" | base64 -d > "$key"
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*unsigned.apk' -print -quit)
          test -s "$apk"
          mkdir deliver
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -P 16 -f 4 "$apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$key" --ks-pass env:PASS --out deliver/Ploom-arm64.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose deliver/Ploom-arm64.apk
          "$tools/zipalign" -c -P 16 4 deliver/Ploom-arm64.apk
          python3 ../../scripts/check-arm64.py deliver/Ploom-arm64.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.pair && format('{0}-', inputs.version) || '' }}official-${{ runner.os }}
          retention-days: 3
          path: |
            apps/client/deliver/*.apk
            apps/client/deliver/*.exe
            apps/client/deliver/*.sig
          if-no-files-found: error
  verify:
    needs: build
    environment: ploom-release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ${{ inputs.pair && format('{0}-official-*', inputs.version) || 'official-*' }}
          path: deliver
          merge-multiple: true
      - name: Verify signed installer and APK
        env:
          PUBLIC_KEY: ${{ vars.UPDATER_PUBLIC_KEY }}
          VERSION: ${{ inputs.version }}
          CERT_DIGEST: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y minisign
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"
          bash scripts/verify-release-assets.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.pair && format('verified-{0}', inputs.version) || 'verified-release' }}
          path: deliver
          retention-days: 3
          if-no-files-found: error
