name: Signed test packages
on: workflow_dispatch
permissions:
  contents: read
defaults:
  run:
    working-directory: apps/client
jobs:
  test-packages:
    if: github.ref == 'refs/heads/native-completion' && github.actor == github.repository_owner
    environment: ploom-rehearsal
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-latest]
        version: ['0.1.0', '0.1.1-test']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-java@v4
        if: runner.os == 'Linux'
        with: {distribution: temurin, java-version: 17}
      - name: Configure isolated test build
        env:
          TEST_VERSION: ${{ matrix.version }}
          STAGING_HOST: ${{ vars.STAGING_HOST }}
        shell: bash
        run: python ../../scripts/prepare-rehearsal.py "$TEST_VERSION" "$STAGING_HOST"
      - run: npm ci
      - if: runner.os == 'Windows'
        env:
          PLOOM_UPDATER_PUBLIC_KEY: ${{ vars.TEST_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TEST_TAURI_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TEST_TAURI_PASSWORD }}
        shell: bash
        run: |
          test -n "$PLOOM_UPDATER_PUBLIC_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          npm run tauri -- build --bundles nsis
          mkdir deliver
          cp src-tauri/target/release/bundle/nsis/*.exe deliver/Ploom.exe
          cp src-tauri/target/release/bundle/nsis/*.exe.sig deliver/Ploom.exe.sig
      - if: runner.os == 'Linux'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          export NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          rustup target add aarch64-linux-android
          npm run tauri -- android init --ci
          python3 android/prepare.py
          npm run tauri -- android build --apk --target aarch64
      - if: runner.os == 'Linux'
        env:
          STORE: ${{ secrets.TEST_ANDROID_P12_BASE64 }}
          PASS: ${{ secrets.TEST_ANDROID_PASSWORD }}
        run: |
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf %s "$STORE" | base64 -d > "$key"
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*unsigned.apk' -print -quit)
          test -s "$apk"
          mkdir deliver
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -P 16 -f 4 "$apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$key" --ks-key-alias ploom --ks-pass env:PASS --out deliver/Ploom-arm64.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose deliver/Ploom-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: rehearsal-${{ matrix.version }}-${{ runner.os }}
          path: |
            apps/client/deliver/*.apk
            apps/client/deliver/*.exe
            apps/client/deliver/*.sig
          if-no-files-found: error
