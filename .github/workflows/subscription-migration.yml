name: Signed subscription migration
on:
  workflow_run:
    workflows: [Publish Ploom]
    branches: [main]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  packages:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.version.outputs.eligible }}
    steps:
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -eu
          if gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[].name' | grep -qx verified-release; then
            gh run download "$RUN_ID" -n verified-release -D candidate
            jq -e '.version == "0.2.0"' candidate/latest.json >/dev/null && echo 'eligible=true' >> "$GITHUB_OUTPUT"
          fi
          exit 0
  migrate:
    needs: packages
    if: needs.packages.outputs.eligible == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run download 45473222332 -n verified-0.1.3 -D baseline
          gh run download "$RUN_ID" -n verified-release -D candidate
      - if: runner.os == 'Windows'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22}
      - if: runner.os == 'Windows'
        working-directory: apps/client
        run: |
          npm ci
          ../../scripts/windows/Test-SubscriptionsUpgrade.ps1 ../../baseline/Ploom.exe ../../candidate/Ploom.exe
      - if: runner.os == 'Linux'
        run: sudo chmod a+rw /dev/kvm
      - if: runner.os == 'Linux'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          script: bash scripts/test-signed-android-migration.sh
